name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: lukka/get-cmake@a70f1cfa1857a3eecfe0d34962269e1b1e8be56c # v3.30.2
      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DOPTIONS_ATS_CORE_BUILD_CATCH2=ON
          -DOPTIONS_ATS_CORE_BUILD_GTESTS=ON
          -DOPTIONS_ATS_CORE_BUILD_BENCHMARKS=OFF
          -DOPTIONS_ATS_CORE_BUILD_EXAMPLES=ON
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  package:
    name: Build reproducible source package
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: lukka/get-cmake@a70f1cfa1857a3eecfe0d34962269e1b1e8be56c # v3.30.2
      - name: Configure install-only package
        run: >
          cmake -B build-package
          -DOPTIONS_ATS_CORE_BUILD_CATCH2=OFF
          -DOPTIONS_ATS_CORE_BUILD_GTESTS=OFF
          -DOPTIONS_ATS_CORE_BUILD_BENCHMARKS=OFF
          -DOPTIONS_ATS_CORE_BUILD_EXAMPLES=OFF
      - run: cmake --install build-package --prefix "$PWD/stage"
      - name: Verify downstream consumer
        run: |
          cmake -S tests/package -B build-consumer -DCMAKE_PREFIX_PATH="$PWD/stage"
          cmake --build build-consumer -j
          ./build-consumer/options_ats_core_consumer
      - name: Create deterministic archive and checksum
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME//\//-}"
          epoch="$(git show -s --format=%ct HEAD)"
          mkdir -p dist
          tar --sort=name --mtime="@$epoch" --owner=0 --group=0 --numeric-owner \
            -C stage -cf - . | gzip -n > "dist/options-ats-core-$version.tar.gz"
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: options-ats-core-release
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: options-ats-core-release
          path: artifacts
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true

