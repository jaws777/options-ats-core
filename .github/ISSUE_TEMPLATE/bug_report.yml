name: Bug report
description: Report a reproducible defect in options-ats-core
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Exact steps, input data, and observed output.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Compiler, OS, CMake version, and commit hash.
    validations:
      required: true
